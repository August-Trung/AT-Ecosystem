<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AT Tools - MMO Toolkit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" href="/ver-bigger-logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0a0a0a" />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Space Grotesk', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              neon: {
                purple: '#b026ff',
                cyan: '#00f3ff',
                green: '#00ff9d',
                pink: '#ff00aa',
              },
              dark: {
                900: '#0a0a0a',
                800: '#121212',
                700: '#1a1a1a',
              }
            },
            animation: {
              'glow': 'glow 2s ease-in-out infinite alternate',
            },
            keyframes: {
              glow: {
                '0%': { boxShadow: '0 0 5px #b026ff' },
                '100%': { boxShadow: '0 0 20px #00f3ff, 0 0 10px #b026ff' },
              }
            }
          },
        },
      }
    </script>
    <style>
      :root {
        --at-bg: #050505;
        --at-fg: #e0e0e0;
      }
      .theme-light {
        --at-bg: #f5f5f5;
        --at-fg: #111827;
      }
      body {
        background-color: var(--at-bg);
        color: var(--at-fg);
        overflow-x: hidden;
      }
      .theme-light .bg-dark-900 { background-color: #ffffff !important; }
      .theme-light .bg-dark-800 { background-color: #f8fafc !important; }
      .theme-light .bg-dark-700 { background-color: #f1f5f9 !important; }
      .theme-light .bg-dark-600 { background-color: #e2e8f0 !important; }
      .theme-light .bg-black { background-color: #ffffff !important; }
      .theme-light .bg-black\/20 { background-color: rgba(15, 23, 42, 0.06) !important; }
      .theme-light .bg-black\/30 { background-color: rgba(15, 23, 42, 0.08) !important; }
      .theme-light .bg-black\/50 { background-color: rgba(15, 23, 42, 0.1) !important; }
      .theme-light .bg-black\/80 { background-color: rgba(15, 23, 42, 0.55) !important; }
      .theme-light .bg-white\/5 { background-color: rgba(15, 23, 42, 0.04) !important; }
      .theme-light .bg-white\/10 { background-color: rgba(15, 23, 42, 0.06) !important; }
      .theme-light .bg-zinc-950 { background-color: #f8fafc !important; }
      .theme-light .bg-zinc-900 { background-color: #f1f5f9 !important; }
      .theme-light .bg-zinc-800 { background-color: #e2e8f0 !important; }
      .theme-light .bg-zinc-700 { background-color: #cbd5e1 !important; }
      .theme-light .bg-zinc-950\/50 { background-color: rgba(248, 250, 252, 0.7) !important; }
      .theme-light .bg-zinc-900\/50 { background-color: rgba(241, 245, 249, 0.7) !important; }
      .theme-light .bg-zinc-800\/50 { background-color: rgba(226, 232, 240, 0.7) !important; }
      .theme-light .bg-zinc-800\/60 { background-color: rgba(226, 232, 240, 0.75) !important; }
      .theme-light .bg-slate-800\/50 { background-color: rgba(241, 245, 249, 0.75) !important; }
      .theme-light .bg-slate-700\/50 { background-color: rgba(226, 232, 240, 0.8) !important; }
      .theme-light .bg-slate-700 { background-color: #e2e8f0 !important; }
      .theme-light .bg-slate-600 { background-color: #cbd5e1 !important; }
      .theme-light .bg-dark-900\/50 { background-color: rgba(255, 255, 255, 0.7) !important; }
      .theme-light .bg-dark-900\/40 { background-color: rgba(255, 255, 255, 0.65) !important; }
      .theme-light .bg-dark-900\/80 { background-color: rgba(255, 255, 255, 0.92) !important; }
      .theme-light .bg-dark-700\/50 { background-color: rgba(241, 245, 249, 0.7) !important; }
      .theme-light .bg-dark-700\/30 { background-color: rgba(241, 245, 249, 0.5) !important; }
      .theme-light .bg-dark-700\/80 { background-color: rgba(241, 245, 249, 0.9) !important; }
      .theme-light .bg-dark-800\/30 { background-color: rgba(226, 232, 240, 0.5) !important; }
      .theme-light .bg-dark-800\/50 { background-color: rgba(226, 232, 240, 0.7) !important; }
      .theme-light .border-dark-700 { border-color: #e2e8f0 !important; }
      .theme-light .border-dark-700\/50 { border-color: rgba(226, 232, 240, 0.8) !important; }
      .theme-light .border-dark-600\/50 { border-color: rgba(203, 213, 225, 0.8) !important; }
      .theme-light .border-dark-600 { border-color: #cbd5e1 !important; }
      .theme-light .border-dark-800 { border-color: #e2e8f0 !important; }
      .theme-light .border-slate-700 { border-color: #cbd5e1 !important; }
      .theme-light .border-slate-600 { border-color: #cbd5e1 !important; }
      .theme-light .border-white\/10 { border-color: rgba(148, 163, 184, 0.3) !important; }
      .theme-light .border-zinc-800 { border-color: #e2e8f0 !important; }
      .theme-light .border-zinc-700 { border-color: #d1d5db !important; }
      .theme-light .border-zinc-800\/60 { border-color: rgba(226, 232, 240, 0.9) !important; }
      .theme-light .border-zinc-800\/50 { border-color: rgba(226, 232, 240, 0.8) !important; }
      .theme-light .border-zinc-700\/50 { border-color: rgba(226, 232, 240, 0.7) !important; }
      .theme-light .text-white { color: #0f172a !important; }
      .theme-light .text-white\/80 { color: rgba(15, 23, 42, 0.8) !important; }
      .theme-light .text-gray-200 { color: #0f172a !important; }
      .theme-light .text-gray-300 { color: #1f2937 !important; }
      .theme-light .text-gray-400 { color: #334155 !important; }
      .theme-light .text-gray-500 { color: #475569 !important; }
      .theme-light .text-gray-600 { color: #64748b !important; }
      .theme-light .text-gray-700 { color: #334155 !important; }
      .theme-light .text-gray-800 { color: #0f172a !important; }
      .theme-light .text-zinc-200 { color: #0f172a !important; }
      .theme-light .text-zinc-300 { color: #1f2937 !important; }
      .theme-light .text-zinc-400 { color: #334155 !important; }
      .theme-light .text-zinc-500 { color: #475569 !important; }
      .theme-light .text-zinc-600 { color: #64748b !important; }
      .theme-light .placeholder-gray-600::placeholder { color: #94a3b8 !important; }
      .theme-light .placeholder-gray-400::placeholder { color: #94a3b8 !important; }
      .theme-light .from-dark-800 { --tw-gradient-from: #f8fafc !important; --tw-gradient-to: rgba(248, 250, 252, 0) !important; --tw-gradient-stops: var(--tw-gradient-from), var(--tw-gradient-to) !important; }
      .theme-light .from-dark-900 { --tw-gradient-from: #ffffff !important; --tw-gradient-to: rgba(255, 255, 255, 0) !important; --tw-gradient-stops: var(--tw-gradient-from), var(--tw-gradient-to) !important; }
      .theme-light .via-dark-900 { --tw-gradient-stops: var(--tw-gradient-from), #f1f5f9, var(--tw-gradient-to) !important; }
      .theme-light .to-dark-900 { --tw-gradient-to: #e2e8f0 !important; }
      .theme-light .to-dark-800 { --tw-gradient-to: #f1f5f9 !important; }
      .theme-light .to-dark-700 { --tw-gradient-to: #e2e8f0 !important; }
      .theme-light .to-black { --tw-gradient-to: #e2e8f0 !important; }
      .theme-light .bg-gradient-to-br { background-image: linear-gradient(135deg, #ffffff, #e2e8f0) !important; }
      .theme-light .bg-gradient-to-r { background-image: linear-gradient(90deg, #ffffff, #e2e8f0) !important; }
      .theme-light .bg-gradient-to-b { background-image: linear-gradient(180deg, #ffffff, #e2e8f0) !important; }
      .theme-light .markdown-preview { color: #0f172a; }
      .theme-light .markdown-preview h1 { color: #0f172a; border-bottom-color: #e2e8f0; }
      .theme-light .markdown-preview h2,
      .theme-light .markdown-preview h3 { color: #1f2937; }
      .theme-light .markdown-preview blockquote { border-left-color: #94a3b8; color: #475569; background: rgba(15, 23, 42, 0.04); }
      .theme-light .markdown-preview code { background: #f8fafc; color: #0f766e; border-color: #e2e8f0; }
      .theme-light .markdown-preview pre { background: #f8fafc; border-color: #e2e8f0; }
      .theme-light .markdown-preview th { background-color: #f1f5f9; color: #0f172a; }
      .theme-light .markdown-preview th, .theme-light .markdown-preview td { border-color: #e2e8f0; }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0a0a0a;
      }
      ::-webkit-scrollbar-thumb {
        background: #333;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #b026ff;
      }
      .theme-light ::-webkit-scrollbar-track {
        background: #e2e8f0;
      }
      .theme-light ::-webkit-scrollbar-thumb {
        background: #94a3b8;
      }
      .theme-light ::-webkit-scrollbar-thumb:hover {
        background: #64748b;
      }

      /* Markdown Preview Styles */
      .markdown-preview h1 { font-size: 2em; font-weight: bold; margin-bottom: 0.5em; color: white; border-bottom: 1px solid #333; padding-bottom: 0.2em; margin-top: 0.5em; }
      .markdown-preview h2 { font-size: 1.5em; font-weight: bold; margin-top: 1em; margin-bottom: 0.5em; color: #e0e0e0; }
      .markdown-preview h3 { font-size: 1.25em; font-weight: bold; margin-top: 1em; margin-bottom: 0.5em; color: #e0e0e0; }
      .markdown-preview p { margin-bottom: 1em; line-height: 1.6; }
      .markdown-preview ul { list-style-type: disc; padding-left: 1.5em; margin-bottom: 1em; }
      .markdown-preview ol { list-style-type: decimal; padding-left: 1.5em; margin-bottom: 1em; }
      .markdown-preview a { color: #00f3ff; text-decoration: underline; transition: color 0.2s; }
      .markdown-preview a:hover { color: #b026ff; }
      .markdown-preview blockquote { border-left: 4px solid #b026ff; padding-left: 1em; color: #9ca3af; font-style: italic; margin-bottom: 1em; background: rgba(176, 38, 255, 0.05); padding-top: 0.5em; padding-bottom: 0.5em; border-radius: 0 4px 4px 0; }
      .markdown-preview code { background: #1a1a1a; padding: 0.2em 0.4em; border-radius: 4px; font-family: 'JetBrains Mono', monospace; font-size: 0.9em; color: #00ff9d; border: 1px solid #333; }
      .markdown-preview pre { background: #111; padding: 1em; border-radius: 8px; overflow-x: auto; margin-bottom: 1em; border: 1px solid #333; }
      .markdown-preview pre code { background: transparent; padding: 0; color: #e0e0e0; border: none; }
      .markdown-preview img { max-width: 100%; border-radius: 8px; margin: 1em 0; border: 1px solid #333; }
      .markdown-preview hr { border-color: #333; margin: 2em 0; }
      .markdown-preview table { width: 100%; border-collapse: collapse; margin-bottom: 1em; }
      .markdown-preview th, .markdown-preview td { border: 1px solid #333; padding: 0.5em; text-align: left; }
      .markdown-preview th { background-color: #1a1a1a; font-weight: bold; color: white; }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",

    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.9.6",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
