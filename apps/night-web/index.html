<!doctype html>
<html lang="vi">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Midnight Pixel Chat</title>
		<script src="https://cdn.tailwindcss.com"></script>
		<link rel="icon" type="image/png" href="/img/ver-bigger-logo.png" />
		<link
			href="https://fonts.googleapis.com/css2?family=VT323&display=swap"
			rel="stylesheet" />
		<style>
			body {
				font-family: "VT323", monospace;
				font-size: 1.25rem;
				line-height: 1.2;
				image-rendering: pixelated;
				background-color: #030308;
				color: #ffffff;
				margin: 0;
				overflow: hidden;
			}

			.pixel-border {
				border: 4px solid #fff;
				box-shadow:
					0 -4px 0 -2px #fff,
					0 4px 0 -2px #fff,
					-4px 0 0 -2px #fff,
					4px 0 0 -2px #fff;
			}

			.pixel-border-primary {
				border: 4px solid #4f46e5;
				box-shadow:
					0 -4px 0 -2px #4f46e5,
					0 4px 0 -2px #4f46e5,
					-4px 0 0 -2px #4f46e5,
					4px 0 0 -2px #4f46e5;
			}



			@keyframes rainbow-sparkle {
				0% {
					color: #ff0000;
					text-shadow:
						0 0 10px #ff0000,
						0 0 20px #ff0000;
				}
				20% {
					color: #ff00ff;
					text-shadow:
						0 0 10px #ff00ff,
						0 0 20px #ff00ff;
				}
				40% {
					color: #0000ff;
					text-shadow:
						0 0 10px #0000ff,
						0 0 20px #0000ff;
				}
				60% {
					color: #00ffff;
					text-shadow:
						0 0 10px #00ffff,
						0 0 20px #00ffff;
				}
				80% {
					color: #00ff00;
					text-shadow:
						0 0 10px #00ff00,
						0 0 20px #00ff00;
				}
				100% {
					color: #ffff00;
					text-shadow:
						0 0 10px #ffff00,
						0 0 20px #ffff00;
				}
			}

			.special-sparkle {
				animation: rainbow-sparkle 2s linear infinite;
				font-weight: bold;
			}

			@keyframes gold-glow {
				0%,
				100% {
					box-shadow:
						0 0 10px #ffd700,
						inset 0 0 10px #ffd700;
					border-color: #ffd700;
					transform: scale(1);
				}
				50% {
					box-shadow:
						0 0 30px #fff700,
						inset 0 0 15px #fff700;
					border-color: #ffffff;
					transform: scale(1.1);
				}
			}

			.glow-gold {
				animation: gold-glow 1.5s ease-in-out infinite;
			}

			@keyframes marquee {
				0% {
					transform: translateX(0);
				}
				100% {
					transform: translateX(-50%);
				}
			}

			.animate-marquee {
				animation: marquee 40s linear infinite;
			}



			.neon-sign {
				box-shadow:
					0 0 30px rgba(79, 70, 229, 0.5),
					0 0 60px rgba(79, 70, 229, 0.2),
					inset 0 0 30px rgba(79, 70, 229, 0.1);
			}

			.flicker-text {
				text-shadow: 0 0 15px rgba(79, 70, 229, 0.8);
			}

			.city-window {
				position: absolute;
				width: 10px;
				height: 18px;
				background: #d9df4a;
				opacity: 0.45;
			}

			.night-dust {
				position: absolute;
				inset: 0;
				pointer-events: none;
				background-image:
					radial-gradient(circle, rgba(255, 255, 255, 0.45) 0 1px, transparent 2px),
					radial-gradient(circle, rgba(129, 140, 248, 0.35) 0 1px, transparent 2px);
				background-size:
					180px 140px,
					240px 180px;
				background-position:
					24px 18px,
					90px 70px;
				opacity: 0.2;
				z-index: 12;
			}

			.city-fog {
				position: absolute;
				left: 18%;
				right: 18%;
				bottom: 30%;
				height: 88px;
				pointer-events: none;
				background:
					linear-gradient(90deg, transparent, rgba(148, 163, 184, 0.16), transparent) 0 10px / 100% 2px no-repeat,
					linear-gradient(90deg, transparent, rgba(99, 102, 241, 0.12), transparent) 0 44px / 100% 2px no-repeat,
					linear-gradient(90deg, transparent, rgba(226, 232, 240, 0.12), transparent) 0 76px / 100% 1px no-repeat;
				opacity: 0.15;
				z-index: 13;
			}



			::-webkit-scrollbar {
				width: 8px;
			}
			::-webkit-scrollbar-track {
				background: #0a0a14;
			}
			::-webkit-scrollbar-thumb {
				background: #4f46e5;
			}

			input,
			button,
			select,
			textarea {
				font-family: inherit !important;
			}



			.bg-night-city {
				background: url("/img/bg.jpg") no-repeat center center;
				background-size: cover;
			}

			/* === LOBBY 2D CANVAS === */
			.lobby-canvas-container {
				position: relative;
				border: 4px solid #1e1b4b;
				box-shadow:
					inset 0 0 40px rgba(79, 70, 229, 0.1),
					0 0 20px rgba(79, 70, 229, 0.15);
				image-rendering: pixelated;
				background: #0a0a1a;
				overflow: hidden;
			}

			.emoji-bar {
				display: flex;
				gap: 4px;
				justify-content: center;
				padding: 8px;
				background: rgba(15, 23, 42, 0.95);
				border: 2px solid #1e293b;
				border-top: none;
			}

			.emoji-bar button {
				width: 40px;
				height: 40px;
				font-size: 1.4rem;
				border: 2px solid #334155;
				background: #0f172a;
				cursor: pointer;
				transition: all 0.15s;
				display: flex;
				align-items: center;
				justify-content: center;
			}

			.emoji-bar button:hover {
				background: #1e293b;
				transform: scale(1.15);
				border-color: #4f46e5;
			}

			.emoji-bar button:active {
				transform: scale(0.95);
				background: #4f46e5;
			}

			.bartender-panel {
				position: fixed;
				bottom: 16px;
				right: 16px;
				width: 380px;
				max-height: 480px;
				z-index: 600;
				background: rgba(2, 6, 23, 0.97);
				border: 4px solid #4f46e5;
				box-shadow:
					0 0 30px rgba(79, 70, 229, 0.3),
					0 0 60px rgba(79, 70, 229, 0.1),
					inset 0 0 20px rgba(79, 70, 229, 0.05);
				display: flex;
				flex-direction: column;
				backdrop-filter: blur(8px);
			}

			@media (max-width: 640px) {
				.bartender-panel {
					width: calc(100% - 32px);
					bottom: 8px;
					right: 8px;
					left: 8px;
					max-height: 50vh;
				}
			}

			/* Floating config panel overlay */
			.lobby-config-panel {
				position: absolute;
				top: 16px;
				left: 16px;
				width: 300px;
				max-height: calc(100% - 32px);
				z-index: 100;
				background: rgba(2, 6, 23, 0.92);
				border: 4px solid #1e293b;
				box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
				overflow-y: auto;
				transition: transform 0.3s ease, opacity 0.3s ease;
			}

			.lobby-config-panel.collapsed {
				transform: translateX(-110%);
				opacity: 0;
				pointer-events: none;
			}

			.lobby-config-toggle {
				position: absolute;
				top: 16px;
				left: 16px;
				z-index: 110;
				background: rgba(15, 23, 42, 0.95);
				border: 3px solid #334155;
				color: white;
				padding: 8px 12px;
				cursor: pointer;
				font-size: 1.1rem;
				transition: all 0.2s;
			}

			.lobby-config-toggle:hover {
				background: #1e293b;
				border-color: #4f46e5;
			}

			.lobby-config-toggle.panel-open {
				left: 330px;
			}

			@media (max-width: 768px) {
				.lobby-config-panel {
					width: calc(100% - 32px);
					max-height: 60vh;
				}
				.lobby-config-toggle.panel-open {
					left: calc(100% - 48px);
				}
			}

			@keyframes prompt-float {
				0%, 100% { transform: translateY(0); }
				50% { transform: translateY(-4px); }
			}

			.interaction-prompt {
				animation: prompt-float 1.5s ease-in-out infinite;
			}
		</style>
		<script type="importmap">
			{
				"imports": {
					"react/": "https://esm.sh/react@^19.2.4/",
					"react": "https://esm.sh/react@^19.2.4",
					"react-dom/": "https://esm.sh/react-dom@^19.2.4/",
					"peerjs": "https://esm.sh/peerjs@1.5.4",
					"mqtt": "https://esm.sh/mqtt@5.10.1",
					"@google/genai": "https://esm.sh/@google/genai@^1.39.0"
				}
			}
		</script>
	</head>
	<body>
		<div id="root"></div>

		<script type="module" src="/index.tsx"></script>
	</body>
</html>
